<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/run/leaderboard/" />
  <title>Leaderboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--hub-font, system-ui, sans-serif);
      font-size: var(--hub-font-size, 15px);
      background: var(--hub-bg, #f9fafb);
      color: var(--hub-text, #000000);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── App header ── */
    .app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px 0;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--hub-primary, #6366f1);
      padding: 0;
      font-family: inherit;
      display: none;
    }
    .back-btn.visible { display: inline-flex; align-items: center; gap: 4px; }
    .back-btn span { font-size: 0.9rem; }
    .app-title { font-size: 1.25rem; font-weight: 700; flex: 1; }

    /* ── Tab nav ── */
    .tab-nav {
      display: flex;
      border-bottom: 1px solid var(--hub-border, #e5e7eb);
      padding: 0 20px;
      margin-top: 12px;
      gap: 0;
    }
    .tab-nav button {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      color: var(--hub-text-muted, #6b7280);
      transition: color .15s, border-color .15s;
      margin-bottom: -1px;
    }
    .tab-nav button.active {
      color: var(--hub-primary, #6366f1);
      border-bottom-color: var(--hub-primary, #6366f1);
    }

    /* ── Views ── */
    .view { display: none; padding: 20px; flex: 1; }
    .view.active { display: block; }

    /* ── Cards ── */
    .card {
      background: var(--hub-surface, #fff);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 8px);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--hub-text-muted, #6b7280);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 14px;
    }

    /* ── Member avatar ── */
    .member-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .member-avatar.sm { width: 24px; height: 24px; font-size: 0.7rem; }

    /* ── Leaderboard rows ── */
    .lb-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--hub-border, #e5e7eb);
    }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank { font-size: 1.2rem; width: 28px; text-align: center; flex-shrink: 0; }
    .lb-name { flex: 1; font-weight: 600; }
    .lb-meta { font-size: 0.8rem; color: var(--hub-text-muted, #6b7280); }
    .lb-rating { font-weight: 700; font-size: 1rem; color: var(--hub-primary, #6366f1); }
    .lb-record { font-size: 0.8rem; color: var(--hub-text-muted, #6b7280); margin-top: 2px; }
    .lb-no-rating { font-size: 0.8rem; color: var(--hub-text-muted, #6b7280); font-style: italic; }

    /* ── Category champions ── */
    .champions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }
    .champion-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--hub-bg, #f9fafb);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 6px);
      padding: 8px 10px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .champion-chip:hover { border-color: var(--hub-primary, #6366f1); }
    .champion-icon { font-size: 1.1rem; flex-shrink: 0; }
    .champion-info { min-width: 0; }
    .champion-cat { font-size: 0.75rem; color: var(--hub-text-muted, #6b7280); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .champion-name { font-size: 0.85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Categories grid ── */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .category-card {
      background: var(--hub-surface, #fff);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 8px);
      padding: 16px 14px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .category-card:hover { border-color: var(--hub-primary, #6366f1); box-shadow: 0 2px 8px rgba(99,102,241,.08); }
    .category-card-icon { font-size: 1.8rem; }
    .category-card-name { font-weight: 600; font-size: 0.95rem; }
    .category-card-meta { font-size: 0.75rem; color: var(--hub-text-muted, #6b7280); }

    .add-category-card {
      background: none;
      border: 2px dashed var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 8px);
      padding: 16px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--hub-text-muted, #6b7280);
      font-family: inherit;
      font-size: 0.85rem;
      transition: border-color .15s, color .15s;
      min-height: 100px;
    }
    .add-category-card:hover { border-color: var(--hub-primary, #6366f1); color: var(--hub-primary, #6366f1); }
    .add-category-card .plus { font-size: 1.5rem; }

    /* ── Recent matches ── */
    .match-row {
      padding: 10px 0;
      border-bottom: 1px solid var(--hub-border, #e5e7eb);
      font-size: 0.9rem;
    }
    .match-row:last-child { border-bottom: none; }
    .match-teams { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .match-team { display: flex; align-items: center; gap: 4px; }
    .match-team.winner { font-weight: 700; }
    .match-vs { font-size: 0.75rem; color: var(--hub-text-muted, #6b7280); }
    .match-result { font-size: 0.75rem; color: var(--hub-text-muted, #6b7280); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
    .match-delta { font-size: 0.75rem; }
    .match-delta.pos { color: #10b981; }
    .match-delta.neg { color: #ef4444; }

    /* ── Record form ── */
    .record-step { display: none; }
    .record-step.active { display: block; }
    .record-step-header { font-size: 0.8rem; font-weight: 600; color: var(--hub-text-muted, #6b7280); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 16px; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 0.9rem; }
    .form-group select, .form-group input[type="text"], .form-group textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 6px);
      background: var(--hub-bg, #f9fafb);
      color: var(--hub-text, #000000);
      font-size: inherit;
      font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }

    .team-builder { display: flex; flex-direction: column; gap: 16px; margin-bottom: 18px; }
    .team-section { }
    .team-section-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
    .team-slots { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; padding: 8px; background: var(--hub-bg, #f9fafb); border: 1px solid var(--hub-border, #e5e7eb); border-radius: var(--hub-radius, 6px); }

    .member-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .member-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1.5px solid var(--hub-border, #e5e7eb);
      border-radius: 99px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all .15s;
      user-select: none;
    }
    .member-chip.team-a { border-color: #6366f1; background: #eef2ff; }
    .member-chip.team-b { border-color: #f59e0b; background: #fffbeb; }
    .member-chip .chip-label { font-size: 0.7rem; font-weight: 700; }

    .result-options { display: flex; gap: 8px; flex-wrap: wrap; }
    .result-btn {
      flex: 1;
      min-width: 100px;
      padding: 12px 16px;
      border: 2px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 8px);
      background: var(--hub-surface, #fff);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all .15s;
    }
    .result-btn:hover { border-color: var(--hub-primary, #6366f1); background: var(--hub-bg, #f9fafb); }
    .result-btn.selected { border-color: var(--hub-primary, #6366f1); background: color-mix(in srgb, var(--hub-primary, #6366f1) 8%, transparent); color: var(--hub-primary, #6366f1); }
    .result-btn.team-a-win.selected { border-color: #6366f1; background: #eef2ff; color: #4f46e5; }
    .result-btn.team-b-win.selected { border-color: #f59e0b; background: #fffbeb; color: #d97706; }
    .result-btn.draw-win.selected { border-color: #10b981; background: #f0fdf4; color: #059669; }

    .btn-primary {
      background: var(--hub-primary, #6366f1);
      color: var(--hub-primary-fg, #fff);
      border: none;
      border-radius: var(--hub-radius, 6px);
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      transition: background .15s;
    }
    .btn-primary:hover:not(:disabled) { background: var(--hub-primary-hover, #4f46e5); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    .btn-secondary {
      background: var(--hub-surface, #fff);
      color: var(--hub-text, #000000);
      border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 6px);
      padding: 8px 16px;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-secondary:hover { background: var(--hub-bg, #f9fafb); }

    .step-actions { display: flex; gap: 8px; margin-top: 20px; }
    .step-actions .btn-secondary { flex: 0 0 auto; }
    .step-actions .btn-primary { flex: 1; }

    /* ── Modal ── */
    .modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--hub-surface, #fff);
      border-radius: var(--hub-radius, 10px);
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      margin-bottom: 12px;
    }
    .emoji-btn {
      font-size: 1.3rem;
      background: none;
      border: 1.5px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      padding: 4px;
      transition: border-color .1s, background .1s;
      aspect-ratio: 1;
    }
    .emoji-btn:hover { background: var(--hub-bg, #f9fafb); }
    .emoji-btn.selected { border-color: var(--hub-primary, #6366f1); background: color-mix(in srgb, var(--hub-primary, #6366f1) 8%, transparent); }

    .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
    .modal-actions .btn-secondary { flex: 0 0 auto; }
    .modal-actions .btn-primary { flex: 1; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--hub-text-muted, #6b7280);
    }
    .empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .empty-state p { font-size: 0.9rem; }

    /* ── Success flash ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #111827;
      color: #fff;
      padding: 10px 20px;
      border-radius: 99px;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
      z-index: 200;
    }
    .toast.visible { opacity: 1; }
  </style>
</head>
<body>

<div class="app-header">
  <button class="back-btn" id="back-btn" data-testid="back" onclick="goBack()">← <span id="back-label">Back</span></button>
  <h1 class="app-title" id="app-title" data-testid="app-title">🏆 Leaderboard</h1>
</div>

<nav class="tab-nav" id="tab-nav">
  <button class="active" data-testid="tab-rankings" onclick="switchTab('rankings')">Rankings</button>
  <button data-testid="tab-categories" onclick="switchTab('categories')">Categories</button>
  <button data-testid="tab-record" onclick="switchTab('record')">+ Record</button>
</nav>

<!-- ── Rankings tab ── -->
<div id="view-rankings" class="view active">
  <div class="card">
    <div class="card-title">Overall Rankings</div>
    <div id="overall-list" data-testid="overall-list">
      <div class="empty-state"><div class="empty-icon">🏆</div><p>No matches recorded yet</p></div>
    </div>
  </div>
  <div class="card" id="champions-card" data-testid="champions-card" style="display:none">
    <div class="card-title">Category Champions</div>
    <div class="champions-grid" id="champions-grid" data-testid="champions-grid"></div>
  </div>
</div>

<!-- ── Categories tab ── -->
<div id="view-categories" class="view">
  <div class="categories-grid" id="categories-grid" data-testid="categories-grid">
    <button class="add-category-card" data-testid="add-category" onclick="openNewCategory()">
      <span class="plus">+</span>
      <span>New Category</span>
    </button>
  </div>
</div>

<!-- ── Category detail (push nav from categories) ── -->
<div id="view-category-detail" class="view">
  <div class="card">
    <div class="card-title">Rankings</div>
    <div id="cat-detail-rankings" data-testid="cat-detail-rankings"></div>
  </div>
  <div class="card">
    <div class="card-title">Recent Matches</div>
    <div id="cat-detail-matches" data-testid="cat-detail-matches"></div>
  </div>
</div>

<!-- ── Record tab ── -->
<div id="view-record" class="view">
  <!-- Step 1: Category -->
  <div id="record-step-1" class="record-step active card" data-testid="record-step-1">
    <div class="record-step-header">Step 1 of 3 — Choose Category</div>
    <div class="form-group">
      <label for="record-category">Category</label>
      <select id="record-category" data-testid="record-category" onchange="onCategorySelect()">
        <option value="">Select a category…</option>
      </select>
    </div>
    <div id="record-game-type-info" style="display:none; font-size:.85rem; color:var(--hub-text-muted,#6b7280); margin-bottom:16px;"></div>
    <div class="step-actions">
      <button class="btn-primary" onclick="recordNext(2)" disabled id="record-step1-next" data-testid="record-step1-next">Next →</button>
    </div>
  </div>

  <!-- Step 2: Teams -->
  <div id="record-step-2" class="record-step card" data-testid="record-step-2">
    <div class="record-step-header">Step 2 of 3 — Pick Players</div>
    <p id="record-team-hint" style="font-size:.85rem; color:var(--hub-text-muted,#6b7280); margin-bottom:14px;"></p>
    <div class="member-chips" id="record-member-chips" data-testid="member-chips"></div>
    <div class="team-builder" id="record-team-builder">
      <div class="team-section">
        <div class="team-section-label" style="color:#6366f1;">🔵 Team A</div>
        <div class="team-slots" id="team-a-slots" data-testid="team-a-slots"><span style="font-size:.8rem; color:#9ca3af; align-self:center;">No players selected</span></div>
      </div>
      <div class="team-section" id="team-b-section">
        <div class="team-section-label" style="color:#d97706;">🟡 Team B</div>
        <div class="team-slots" id="team-b-slots" data-testid="team-b-slots"><span style="font-size:.8rem; color:#9ca3af; align-self:center;">No players selected</span></div>
      </div>
    </div>
    <div class="step-actions">
      <button class="btn-secondary" onclick="recordNext(1)">← Back</button>
      <button class="btn-primary" onclick="recordNext(3)" disabled id="record-step2-next" data-testid="record-step2-next">Next →</button>
    </div>
  </div>

  <!-- Step 3: Result -->
  <div id="record-step-3" class="record-step card" data-testid="record-step-3">
    <div class="record-step-header">Step 3 of 3 — Record Result</div>
    <div class="form-group">
      <label>Who won?</label>
      <div class="result-options" id="result-options" data-testid="result-options"></div>
    </div>
    <div class="form-group">
      <label for="record-notes">Notes (optional)</label>
      <textarea id="record-notes" data-testid="field-notes" placeholder="e.g. close game, overtime…"></textarea>
    </div>
    <div class="step-actions">
      <button class="btn-secondary" onclick="recordNext(2)">← Back</button>
      <button class="btn-primary" onclick="submitMatch()" disabled id="record-submit" data-testid="record-submit">Save Match</button>
    </div>
  </div>
</div>

<!-- ── New Category modal ── -->
<div class="modal-backdrop" id="modal-new-category" data-testid="new-category-modal">
  <div class="modal">
    <h2>New Category</h2>
    <div class="form-group">
      <label for="new-cat-name">Name</label>
      <input type="text" id="new-cat-name" data-testid="field-category-name" placeholder="e.g. Foosball, Mario Kart…" oninput="onNewCatInput()" />
    </div>
    <div class="form-group">
      <label>Icon</label>
      <div class="emoji-grid" id="emoji-grid"></div>
    </div>
    <div class="form-group">
      <label for="new-cat-type">Game Type</label>
      <select id="new-cat-type" data-testid="field-category-type">
        <option value="1v1">1 vs 1 — two individual players</option>
        <option value="team">Teams — two teams of any size</option>
        <option value="cooperative">Co-op — everyone on the same side</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" data-testid="cancel-category" onclick="closeNewCategory()">Cancel</button>
      <button class="btn-primary" id="create-cat-btn" data-testid="create-category" onclick="createCategory()" disabled>Create</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" data-testid="toast"></div>

<script type="module">
import { esc, memberColor, initial } from "/hub-sdk.js";
import {
  calcMatchDeltas, calcFfaDeltas, buildOverallRankings, categoryChampions,
  rankLabel, formatRating, gameTypeLabel, DEFAULT_RATING
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB      = window.__DB_URL      ?? "";
const ME      = window.__CURRENT_MEMBER ?? null;
const APP_ID  = window.__APP_ID ?? "leaderboard";
const EVENTS  = window.__EVENTS_URL ?? "";

async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS) return;
  try {
    await fetch(EVENTS, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, subject_id: subjectId, payload }),
    });
  } catch {
    // The match batch has already committed; publishing is best-effort.
  }
}

// Categories are adult_writable (manifest row_policies): the server rejects
// category writes from non-adults, so gate the UI to match. Demo mode (no ME)
// stays permissive so the standalone preview keeps working.
function canManageCategories() {
  return !ME || ME.role === "adult";
}

// ── State ──────────────────────────────────────────────────────────────────────
let members = [];
let categories = [];
let allRatings = [];
let currentTab = "rankings";
let currentCategoryId = null;

// Record flow state
let recordState = { categoryId: null, gameType: null, teamA: [], teamB: [], winningSide: null };

// ── DB helper ──────────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  // A refused write is not data. This used to return res.json() whatever the
  // status, so a 403 read as a successful call with no rows — and the caller
  // carried on. ensureCategory() was the sharp edge: categories are
  // adult_writable, so a child's implicit category INSERT is rejected, yet the
  // function still returned the id it had generated and the match rows that
  // followed referenced a category that was never created. The schema has no
  // foreign keys, so nothing downstream noticed; the household simply had
  // matches and ratings attached to nothing, invisible in every category view.
  if (!res.ok) {
    const detail = await res.text().catch(() => "");
    throw new Error(`app-db ${res.status}: ${detail.slice(0, 200)}`);
  }
  return res.json();
}

// Atomic multi-statement form of /api/db. Recording one match is a match row,
// a participant row per player, and a ratings upsert per player — issued one at
// a time, a failure partway through left a match with one participant and a
// half-updated leaderboard that the UI has no way to repair. D1 runs a batch
// transactionally, so it lands whole or not at all. Throws on rejection so the
// caller does not treat a refused batch as applied.
// /api/db caps a batch at 25 statements. A match costs one match row plus a
// participant row and a ratings upsert per player, so a match of up to twelve
// players lands as a single atomic batch; a bigger free-for-all spans batches
// and loses atomicity only at that boundary — which is where every match was
// before, at every statement.
const MAX_BATCH = 25;
// A whole match must land in ONE transaction: one match row plus two statements
// per participant (the participant row and the rating upsert). dbBatchAll splits
// at MAX_BATCH, so 1 + 2N must stay within it — twelve players, not thirteen.
//
// Past that the match is split across two transactions, and a failure in the
// second leaves the match row and the first twelve ratings committed while the
// rest are missing. The retry cannot repair it: source_event_id is unique, so
// the whole event is treated as already imported. A half-recorded match with no
// way back is worse than a refused one.
const MAX_MATCH_PARTICIPANTS = Math.floor((MAX_BATCH - 1) / 2);

async function dbBatch(statements) {
  if (!DB || !statements.length) return [];
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ statements }),
  });
  const body = await res.json();
  if (!res.ok) throw new Error(body?.error ?? `batch failed (${res.status})`);
  return body.results ?? [];
}

async function dbBatchAll(statements) {
  for (let i = 0; i < statements.length; i += MAX_BATCH) {
    await dbBatch(statements.slice(i, i + MAX_BATCH));
  }
}

// One statement per player instead of a read-then-INSERT-or-UPDATE pair. Besides
// halving the batch, it closes a race of its own: two matches whose pre-read
// both found no rating row for a player each tried to INSERT one, and the
// second hit UNIQUE (member_id, category_id).
// The rating is applied as a DELTA, not written as an absolute.
//
// Every open client ingests events, so two matches can read the same starting
// rating and both compute an absolute "after" from it. Writing those absolutes,
// the last one lands and the other match's Elo change is DISCARDED — while
// games_played and wins/losses, which were already deltas, counted both. The
// scoreboard then showed a member who had played two games with only one game's
// worth of rating movement, and nothing anywhere recorded that a result had been
// dropped.
//
// Adding both deltas is an approximation of playing the matches in sequence (the
// second delta was computed against the pre-first rating rather than the
// post-first one), and that is the honest trade: an Elo value a few points from
// the strictly-sequential answer, instead of a match that silently never
// happened. The alternative — a version column with read-compare-retry — buys
// exactness at the cost of a retry loop in every client for a family scoreboard.
//
// The INSERT arm still carries an absolute, because a brand-new rating row has
// nothing to add to. MAX(100, ...) keeps the floor the client applies.
//
// WHAT THIS STILL DOES NOT FIX, and cannot from here: two concurrent matches
// compute their deltas from the same stale rating, so the result differs from
// playing them in sequence, and the rating_before/rating_after written on the
// participant rows describe a value the leaderboard never actually held. They
// are an honest record of what THAT match calculated, not of the running total.
// Exact Elo needs the two matches serialized — a read-compare-retry loop, which
// cannot work here because a conditional UPDATE that matches nothing does not
// fail its batch (the match row lands, the rating silently does not), or
// server-side scoring, which a `runtime: "static"` app does not have. The
// approximation is bounded and self-correcting; the alternative available at
// this layer is not.
const RATING_UPSERT = `INSERT INTO app_leaderboard__lb_ratings
  (id, member_id, category_id, rating, games_played, wins, losses)
  VALUES (?, ?, ?, ?, 1, ?, ?)
  ON CONFLICT (member_id, category_id) DO UPDATE SET
    rating = MAX(100, rating + ?),
    games_played = games_played + 1,
    wins = wins + excluded.wins,
    losses = losses + excluded.losses`;

// ── Init ───────────────────────────────────────────────────────────────────────
async function init() {
  await Promise.all([loadMembers(), loadData()]);
  renderRankings();
  // Process external events in the background; refresh rankings when done
  Promise.all([processGameEvents()])
    .then(() => loadData().then(renderRankings))
    .catch(console.error);
}

// ── Generic game.completed event processing ───────────────────────────────────
// Any app publishing game.completed with game_type "1v1" or "ranked" and a
// category_name/category_icon will automatically create a leaderboard category
// and have its results folded into ratings.

// One match is written as ONE batch: the match row, then a participant row and
// a ratings write per player. The SELECT-then-INSERT dedup above only narrows
// the common case — processGameEvents() runs client-side in every member's
// browser, so two tabs can both find no row. The UNIQUE index on
// source_event_id (migration 003) is what actually stops the second one; its
// batch fails as a whole and the event is skipped rather than double-counted.
//
// Ratings remain read-modify-write for the Elo value itself, which is inherent
// to Elo — `rating_before` has to come from the pre-read. Two DIFFERENT matches
// in the same category, processed concurrently, can still order awkwardly; that
// is a rating-value question, not the correctness bug this closes.
async function writeMatch({ matchId, categoryId, event, categoryName, deltas, isWinner }) {
  const statements = [{
    // logged_by is REQUIRED by the row policy and its value is replaced by the
    // hub with the caller's own id, so what is passed here is a placeholder the
    // engine overwrites — it cannot be forged and it cannot be left out.
    //
    // For this path that identity is whichever member's session happened to
    // process the event, which is nobody's claim about the result. The UI
    // therefore keys off source_event_id and labels these matches "imported
    // automatically" instead of naming a person; see loggedByLabel().
    sql: `INSERT INTO app_leaderboard__lb_matches (id, category_id, played_at, notes, source_event_id, source_event_seq, logged_by, visibility)
          VALUES (?, ?, ?, ?, ?, ?, ?, 'everyone')`,
    params: [matchId, categoryId, event.created_at, `Via ${categoryName}`, event.id, Number(event.sequence) || 0, ME?.id ?? ""],
  }];
  for (const d of deltas) {
    const won = isWinner(d);
    const newRating = Math.max(100, d.ratingBefore + d.delta);
    statements.push({
      sql: `INSERT INTO app_leaderboard__lb_participants (id, match_id, member_id, team, result, rating_before, rating_after)
            VALUES (?, ?, ?, ?, ?, ?, ?)`,
      params: [crypto.randomUUID(), matchId, d.memberId, won ? 0 : 1, won ? "win" : "loss", d.ratingBefore, newRating],
    });
    statements.push({
      sql: RATING_UPSERT,
      // Trailing param is the DELTA the conflict arm applies; newRating is the
      // absolute the insert arm uses for a member with no rating row yet.
      params: [crypto.randomUUID(), d.memberId, categoryId, newRating, won ? 1 : 0, won ? 0 : 1, d.delta],
    });
  }
  await dbBatchAll(statements);
}

// The hub rejects — never clamps — a limit above this, and the caller below
// treats any non-2xx as "nothing to do". Asking for more than the maximum does
// not get a big page, it gets a 400 and silently disables ingestion entirely.
const EVENT_PAGE_SIZE = 500;
// A launch will drain at most this many pages. Purely a runaway guard: the loop
// already exits on a short page.
const EVENT_MAX_PAGES = 40;

// Can this payload actually determine an ordering? Ratings are irreversible —
// the next match is computed from the last — so a payload that does not clearly
// say who beat whom must be dropped, never guessed at.
//
// `rank` was optional in the event contract until recently, and nothing required
// member ids or ranks to be distinct. Sorting on a missing rank crowned an
// arbitrary member, and a repeated member id updated one person's rating and
// games_played twice for a single game. Both are now rejected at publish, but
// the backlog can still hold events written under the old rules.
function isScorableGame(gameType, winnerId, loserId, results, roster) {
  // EVERY participant must be a current member of this household. Neither the
  // event contract nor a shape check can do this — both see ids only as
  // non-empty distinct strings — and two things go wrong without it:
  //
  //  * a backlog event naming a REMOVED member re-creates the lb_ratings row
  //    that `member_references.lb_ratings.on_removed: "delete"` deleted,
  //    resurrecting data the platform was asked to erase;
  //  * an id belonging to nobody creates a ghost participant AND moves a real
  //    member's rating, because Elo is computed against the opponent.
  //
  // Permanent, not transient: an id absent from the current roster was removed
  // or never existed, and neither becomes valid later. The caller refuses to run
  // at all when the roster is empty, so "not in roster" can never mean "roster
  // failed to load".
  const known = (id) => Boolean(id) && roster.has(id);
  if (gameType === "1v1") return known(winnerId) && known(loserId) && winnerId !== loserId;
  if (gameType !== "ranked") return false;
  // Upper bound as well as lower: more participants than fit in one transaction
  // cannot be recorded atomically, and a half-written match cannot be retried.
  // The hub now refuses these at publish too; this covers the backlog written
  // before it did.
  if (!Array.isArray(results) || results.length < 2) return false;
  if (results.length > MAX_MATCH_PARTICIPANTS) return false;
  const ids = results.map((r) => r?.member_id);
  const ranks = results.map((r) => r?.rank);
  if (!ids.every(known) || new Set(ids).size !== ids.length) return false;
  // Ranks must all be present and distinct, or the sort order — and therefore
  // the winner — is decided by array position rather than by the result.
  if (ranks.some((r) => typeof r !== "number" || !Number.isFinite(r))) return false;
  return new Set(ranks).size === ranks.length;
}

// ── Ingestion cursor ──────────────────────────────────────────────────────────
//
// Kept in its own row rather than derived from the matches written, because the
// cursor has to advance past events that produce NO match — ones already
// imported, and ones whose payload can never be processed. See migration 006.
const EVENT_CURSOR_KEY = "event_cursor";

// The cursor is (epoch, sequence) and both live in ONE ROW. A sequence number
// is meaningless without the generation it was issued in, so they are read and
// written together — see the guard in writeEventCursor.
async function readEventCursor() {
  try {
    const { rows } = await db(
      `SELECT value, epoch FROM app_leaderboard__lb_sync WHERE key = ?`, [EVENT_CURSOR_KEY]
    );
    return {
      sequence: Number(rows?.[0]?.value) || 0,
      epoch: Number(rows?.[0]?.epoch) || 0,
    };
  } catch { return { sequence: 0, epoch: 0 }; }
}

// Force the cursor to the floor of the CURRENT generation, ignoring the guard.
// The only caller is the rowid-reuse detector, which has the one piece of
// evidence that justifies it: a page that came back at or below the sequence it
// asked past. See the note at that call site for why this cannot be the guarded
// write and must not be reachable from anywhere else.
async function resetEventCursor(epoch) {
  try {
    await db(
      `INSERT INTO app_leaderboard__lb_sync (key, value, epoch) VALUES (?, 0, ?)
       ON CONFLICT (key) DO UPDATE SET value = 0, epoch = excluded.epoch`,
      [EVENT_CURSOR_KEY, Math.max(0, Number(epoch) || 0)]
    );
  } catch { /* next launch sees the same evidence and tries again */ }
}

// Advance the cursor, or move it to a new generation. One statement, because
// (epoch, sequence) is one value: the update wins only if the incoming
// generation is NEWER, or the same generation with a HIGHER sequence.
//
// Both halves of that guard are load-bearing. Without the epoch comparison a
// tab holding a stale, high sequence from the previous generation would beat a
// cursor another tab had just reset to 0 for the new one — the sequence guard
// alone sees a bigger number and takes it, restoring a position that no longer
// exists. Without the sequence comparison two tabs in the same generation could
// undo each other's progress and never converge.
//
// A reset is not a special case: it is a write of (newEpoch, 0), which wins on
// the epoch arm. That is why there is no separate unconditional reset — one
// that ignored the guard would be the exact hole this closes.
async function writeEventCursor(sequence, epoch) {
  const nextSeq = Math.max(0, Number(sequence) || 0);
  const nextEpoch = Math.max(0, Number(epoch) || 0);
  try {
    await db(
      `INSERT INTO app_leaderboard__lb_sync (key, value, epoch) VALUES (?, ?, ?)
       ON CONFLICT (key) DO UPDATE SET value = excluded.value, epoch = excluded.epoch
        WHERE excluded.epoch > app_leaderboard__lb_sync.epoch
           OR (excluded.epoch = app_leaderboard__lb_sync.epoch
               AND excluded.value > app_leaderboard__lb_sync.value)`,
      [EVENT_CURSOR_KEY, nextSeq, nextEpoch]
    );
  } catch { /* a cursor we could not persist just means the next launch re-reads */ }
}

async function importedEventIds(ids) {
  const seen = new Set();
  for (let i = 0; i < ids.length; i += 90) {
    const chunk = ids.slice(i, i + 90);
    const { rows } = await db(
      `SELECT source_event_id FROM app_leaderboard__lb_matches WHERE source_event_id IN (${chunk.map(() => "?").join(",")})`,
      chunk,
    );
    for (const r of rows ?? []) seen.add(r.source_event_id);
  }
  return seen;
}

async function processGameEvents() {
  // No roster, no ingestion. loadMembers() sets `members = []` when the fetch
  // FAILS, so an empty roster means "unknown", not "nobody" — and the
  // participant check below treats an unrecognised member as a permanent skip.
  // Running with an empty roster would therefore mark every event permanently
  // unprocessable and advance the cursor past the entire backlog. Waiting a
  // launch costs nothing; that would lose the events for good.
  if (!members.length) return;
  const roster = new Set(members.map((m) => m.id));
  const categoryCache = new Map();

  for (let page = 0; page < EVENT_MAX_PAGES; page++) {
    // The cursor is INDEPENDENT PERSISTED STATE, not something derived from the
    // matches written. A derived cursor can only advance when a row is written,
    // but most events legitimately write nothing — one already imported is
    // deduped, a malformed payload is ignored forever — so on an upgraded
    // household (every existing match defaulting to source_event_seq 0) the
    // first page deduped entirely, wrote nothing, left the cursor at 0, and the
    // same 500 events were re-read until the runaway guard tripped. Ingestion
    // stalled permanently and silently. See migration 006.
    const { sequence: afterSequence, epoch: storedEpochRead } = await readEventCursor();
    let storedEpoch = storedEpochRead;
    let epoch = storedEpoch;

    let events = [];
    try {
      // order=asc is what makes a backlog drainable. The page is truncated by
      // LIMIT, so newest-first returns the top slice and leaves everything below
      // it permanently unreachable once the cursor moves past. Ascending walks
      // FORWARD from the cursor, so page N+1 begins exactly where page N ended.
      const url = `/api/events?type=game.completed&order=asc&limit=${EVENT_PAGE_SIZE}` +
        `&after_sequence=${afterSequence}`;
      const res = await fetch(url);
      if (!res.ok) return;
      // The GENERATION the sequence numbers belong to. `sequence` is a SQLite
      // rowid and rowids are reused, so deleting the newest events (an app
      // uninstall) renumbers later ones underneath a stored cursor: the number
      // survives but no longer means the same position. When the hub reports a
      // different epoch than the one saved with the cursor, the cursor is not
      // stale — it is meaningless — and the only safe reading is to start over.
      // Replay is free because source_event_id dedups.
      epoch = Number(res.headers.get("X-Events-Epoch")) || 0;
      events = await res.json();
    } catch { return; }

    if (epoch !== storedEpoch) {
      await writeEventCursor(0, epoch);
      storedEpoch = epoch;
      // Re-ask from the floor rather than processing a page fetched against the
      // old cursor: under the new numbering that page is an arbitrary slice.
      continue;
    }

    if (!events.length) return;

    // The API is asked for ascending order, but the cursor's correctness must
    // not depend on the server honouring it — sort locally too. Processing runs
    // oldest-first and stops at the first transient failure, so the cursor only
    // ever sits at the end of an unbroken run of successes.
    events.sort((a, b) => (a.sequence ?? 0) - (b.sequence ?? 0));

    // The highest sequence this page has finished with, counting deduped and
    // permanently-ignored events — leaving those behind the cursor is what
    // stalls ingestion.
    let handled = afterSequence;

    // ROWID REUSE. The event sequence is a SQLite rowid, and rowids are reused:
    // after a retention purge or an app uninstall the next insert is
    // MAX(rowid)+1 over the SURVIVING rows, so the numbering can restart below a
    // live cursor. The hub detects that (cursor above the table's maximum) and
    // serves from the start of the window instead — which is how a page can come
    // back holding sequences at or below the cursor we asked past.
    //
    // That has to be handled here, not ignored, and specifically BECAUSE the
    // cursor is monotonic. Every event in such a page is below `handled`, so
    // nothing advances it, the page stays full, and the same 500 events are
    // re-read to the page cap on every launch — a permanent stall with the
    // remainder of the backlog unreachable. Dropping the cursor to the floor
    // once is the recovery: it replays, and replay is free because
    // source_event_id dedups.
    // Belt and braces behind the epoch check above: the epoch catches a
    // renumbering the hub KNOWS about, this catches one it does not — any delete
    // path that forgets to bump, on a hub too old to send the header at all.
    // Pass the CURRENT epoch, not zero: writing a zero epoch here would look
    // like a mismatch on the next launch and reset again, every launch, forever.
    const lowest = Math.min(...events.map((e) => Number(e.sequence) || 0));
    if (afterSequence > 0 && lowest <= afterSequence) {
      // Same generation, so the guarded write would refuse a lower sequence.
      // This one case writes unconditionally.
      //
      // Inventing a local epoch (epoch + 1) instead would deadlock: the hub
      // would keep reporting the real epoch, every page would read as a
      // mismatch, and the corrective write would then lose its own guard.
      //
      // Bypassing the guard is safe here in a way a stale tab's write is not.
      // The hazard the guard exists for is an OLD generation's high sequence
      // beating a reset; this writes a LOW sequence on evidence gathered from
      // the page in hand. If a concurrent tab has legitimately advanced, it
      // re-advances and we re-read — dedup makes that free.
      await resetEventCursor(epoch);
      handled = 0;
    }

    // One dedup query per page rather than per event. A replay of an already
    // imported page is the common case on upgrade, and asking row by row made it
    // 500 round trips; `IN` chunks stay under D1's 100-bound-parameter cap.
    const alreadyImported = await importedEventIds(events.map((e) => e.id));

    // `stopped` marks a TRANSIENT failure — the only thing that may hold the
    // cursor back.
    let stopped = false;
    for (const event of events) {
      const seq = Number(event.sequence) || 0;
      if (alreadyImported.has(event.id)) { handled = Math.max(handled, seq); continue; }

      const { game_type, winner_id, loser_id, results, category_name, category_icon } = event.payload ?? {};
      // PERMANENT: this payload will never become processable, so the cursor
      // must move past it. Leaving it behind would re-read it on every page.
      if (!game_type || !category_name) { handled = Math.max(handled, seq); continue; }

      // Every payload check happens BEFORE the category is created, and each one
      // is permanent. Two reasons this ordering matters:
      //
      //  * an unrecognised game_type used to reach neither branch below, so it
      //    never advanced `handled` — one such event at the end of a page was
      //    re-read forever and later pages were never reached;
      //  * it also created a category first, leaving an empty scoring category
      //    behind for a game the app cannot score.
      //
      // The hub now rejects these shapes at publish (game.completed takes an
      // enum game_type and requires unique member ids and ranks), but events
      // stored under the OLD contract are still replayed from the backlog, and
      // this consumer folds them into ratings that no later match can correct.
      // So it validates for itself rather than trusting the bus.
      if (!isScorableGame(game_type, winner_id, loser_id, results, roster)) {
        handled = Math.max(handled, seq);
        continue;
      }

      // A category's identity is (name, game_type). Both halves matter, and the
      // ICON is deliberately not part of it — a publisher changing its emoji
      // must not fork the scoring history.
      //
      // game_type does, because it decides how results are folded into ratings.
      // Keyed on name alone, "Ping Pong" published once as 1v1 and once as
      // ranked collapsed into ONE category whose stored type was whichever event
      // arrived first: ranked results were then scored as 1v1 (and the
      // manual-entry form offered the wrong shape) with nothing to indicate it.
      // Two categories sharing a name is the honest outcome — the alternative is
      // silently discarding one game's history or corrupting the other's.
      const cacheKey = `${category_name}|${game_type}`;
      if (!categoryCache.has(cacheKey)) {
        const id = await ensureCategory(category_name, category_icon ?? "", game_type);
        // TRANSIENT, so stop rather than skip: lb_categories is adult_writable, so
        // a child's session simply cannot create it, and an adult's later will.
        // `continue` here would move on to a newer event whose success advances
        // the cursor past this one for good.
        if (!id) { stopped = true; break; }
        categoryCache.set(cacheKey, id);
      }
      const categoryId = categoryCache.get(cacheKey);

      if (game_type === "1v1") {
        if (!winner_id || !loser_id) { handled = Math.max(handled, seq); continue; }   // permanent

        const { rows: existingRatings } = await db(
          `SELECT * FROM app_leaderboard__lb_ratings WHERE category_id = ? AND member_id IN (?, ?)`,
          [categoryId, winner_id, loser_id]
        );
        const ratingMap = new Map(existingRatings.map(r => [r.member_id, r]));
        const getRating = (id) => ratingMap.get(id)?.rating ?? DEFAULT_RATING;

        const teamA = [{ memberId: winner_id, rating: getRating(winner_id) }];
        const teamB = [{ memberId: loser_id,  rating: getRating(loser_id)  }];
        const deltas = calcMatchDeltas(teamA, teamB, "A");

        try {
          await writeMatch({
            matchId: crypto.randomUUID(), categoryId, event, categoryName: category_name,
            deltas, isWinner: (d) => d.memberId === winner_id,
          });
          handled = Math.max(handled, seq);
        } catch { stopped = true; break; }   // transient: cursor stays put, retried next page/launch

      } else if (game_type === "ranked") {
        if (!Array.isArray(results) || results.length < 2) { handled = Math.max(handled, seq); continue; }   // permanent

        const ranked = [...results].sort((a, b) => a.rank - b.rank);
        const memberIds = ranked.map(r => r.member_id);
        const placeholders = memberIds.map(() => "?").join(",");
        const { rows: existingRatings } = await db(
          `SELECT * FROM app_leaderboard__lb_ratings WHERE category_id = ? AND member_id IN (${placeholders})`,
          [categoryId, ...memberIds]
        );
        const ratingMap = new Map(existingRatings.map(r => [r.member_id, r]));
        const getRating = (id) => ratingMap.get(id)?.rating ?? DEFAULT_RATING;

        const rankedPlayers = ranked.map(r => ({ memberId: r.member_id, rating: getRating(r.member_id) }));
        const deltas = calcFfaDeltas(rankedPlayers);

        try {
          await writeMatch({
            matchId: crypto.randomUUID(), categoryId, event, categoryName: category_name,
            deltas, isWinner: (d) => d.memberId === rankedPlayers[0].memberId,
          });
          handled = Math.max(handled, seq);
        } catch { stopped = true; break; }   // transient: cursor stays put, retried next page/launch
      }
    }

    // Persist what this page finished with BEFORE deciding whether to continue.
    // Without this the next page would ask from the old cursor and re-read the
    // same events; with it, a run that stops on a transient failure still keeps
    // the ground it gained.
    await writeEventCursor(handled, storedEpoch);

    // A short page means the backlog is drained. A stop means a transient
    // failure is holding the cursor at the last event that succeeded, so there
    // is nothing to gain from asking again this launch.
    if (stopped || events.length < EVENT_PAGE_SIZE) return;
  }
}

async function ensureCategory(name, icon, gameType) {
  // Matched on (name, game_type), the same identity the page cache uses. Looking
  // up by name alone returned a category with a DIFFERENT scoring model and
  // folded incompatible results into it.
  const { rows } = await db(
    `SELECT id FROM app_leaderboard__lb_categories WHERE name = ? AND game_type = ?`,
    [name, gameType]
  );
  if (rows.length) return rows[0].id;
  try {
    // Insert-then-read-back, not insert-and-assume. Every open client ingests,
    // so two of them can both find nothing above and both try to create the
    // category; the UNIQUE (name, game_type) index (migration 006) makes the
    // second a no-op instead of a duplicate, and the read-back returns whichever
    // row actually won. Trusting the id we generated would attach this match to
    // a row that does not exist.
    await db(
      `INSERT INTO app_leaderboard__lb_categories (id, name, icon, game_type, created_at, created_by)
       VALUES (?, ?, ?, ?, ?, '') ON CONFLICT (name, game_type) DO NOTHING`,
      [crypto.randomUUID(), name, icon, gameType, new Date().toISOString()]
    );
    const { rows: after } = await db(
      `SELECT id FROM app_leaderboard__lb_categories WHERE name = ? AND game_type = ?`,
      [name, gameType]
    );
    return after?.[0]?.id ?? null;
  } catch { return null; }
}

async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "adult" },
      { id: "demo-2", name: "Jordan", role: "child" },
      { id: "demo-3", name: "Sam", role: "adult" },
      { id: "demo-4", name: "Taylor", role: "child" },
    ];
    return;
  }
  try {
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    members = ((await res.json())["family.members"]) ?? [];
  } catch { members = []; }
}

async function loadData() {
  const [catResult, ratingResult] = await Promise.all([
    // A LEFT JOIN, not the correlated subqueries this used to run: lb_matches is
    // now governed (owner_or_visibility on logged_by), and the row-policy
    // rewriter refuses a governed table named only inside a subquery. A joined
    // table is a top-level reference, so its policy is applied in the ON clause
    // and LEFT JOIN semantics survive — a category with no matches still lists,
    // with match_count 0.
    db(`SELECT c.id, c.name, c.icon, c.game_type, c.created_at, c.created_by, COUNT(m.id) AS match_count, MAX(m.played_at) AS last_played FROM app_leaderboard__lb_categories c LEFT JOIN app_leaderboard__lb_matches m ON m.category_id = c.id GROUP BY c.id, c.name, c.icon, c.game_type, c.created_at, c.created_by ORDER BY last_played DESC`),
    db(`SELECT * FROM app_leaderboard__lb_ratings`),
  ]);
  categories = catResult.rows;
  allRatings = ratingResult.rows;
}

            ? `<div class="lb-rating" data-testid="lb-rating">${rating}</div>`

    .filter(c => champMap.has(c.id))

// ── Category detail ────────────────────────────────────────────────────────────
// Who entered this match. Attribution is the only lever this app has: ratings
// are computed in the browser (runtime: "static"), so no policy can stop a
// determined member editing a score — but a result with a name on it can be
// questioned, and an anonymous one cannot. Rows predating migration 006 carry
// an empty logged_by and say nothing rather than guessing.
function loggedByLabel(match) {
  // An imported match was written by whichever member's session happened to run
  // the ingestion, not by a person choosing to record a result. Naming them
  // would be a false claim — and an arbitrary one, since under concurrent
  // ingestion the unique-index winner decides whose session got there first.
  if (match.source_event_id) return `<span>· imported automatically</span>`;
  if (!match.logged_by) return "";
  const m = members.find((x) => x.id === match.logged_by);
  return `<span>· logged by ${esc(m ? m.name : "a former member")}</span>`;
}

window.openCategoryDetail = async function(categoryId) {
  currentCategoryId = categoryId;
  const cat = categories.find(c => c.id === categoryId);
  if (!cat) return;

  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-category-detail").classList.add("active");
  document.getElementById("tab-nav").style.display = "none";
  document.getElementById("back-btn").classList.add("visible");
  document.getElementById("back-label").textContent = currentTab === "categories" ? "Categories" : "Rankings";
  document.getElementById("app-title").textContent = `${cat.icon} ${cat.name}`;

  const [{ rows: catRatings }, { rows: matches }] = await Promise.all([
    db(`SELECT * FROM app_leaderboard__lb_ratings WHERE category_id = ? ORDER BY rating DESC`, [categoryId]),
    db(`SELECT * FROM app_leaderboard__lb_matches WHERE category_id = ? ORDER BY played_at DESC LIMIT 20`, [categoryId]),
  ]);
  // Participants are fetched for exactly the matches just loaded, by id.
  // This used to be `match_id IN (SELECT id FROM lb_matches ... LIMIT 20)`, which
  // stopped being legal once lb_matches became governed — the rewriter fails
  // closed on a governed table named only inside a subquery. Naming the ids
  // directly keeps the read bounded to the same 20-match window (a JOIN could
  // not have inherited that LIMIT and would have pulled the category's entire
  // history), and 20 placeholders sit far under the runtime's 100-parameter cap.
  const matchIds = matches.map((m) => m.id);
  const { rows: participants } = matchIds.length
    ? await db(
        `SELECT * FROM app_leaderboard__lb_participants WHERE match_id IN (${matchIds.map(() => "?").join(",")})`,
        matchIds,
      )
    : { rows: [] };

  // Rankings
  const rankingsEl = document.getElementById("cat-detail-rankings");
  if (!catRatings.length) {
    rankingsEl.innerHTML = `<div class="empty-state"><div class="empty-icon">${esc(cat.icon)}</div><p>No matches yet</p></div>`;
  } else {
    rankingsEl.innerHTML = catRatings.map((r, i) => {
      const member = members.find(m => m.id === r.member_id);
      const color = member ? memberColor(r.member_id, members) : "#9ca3af";
      return `
        <div class="lb-row" data-testid="cat-lb-row" data-member-id="${esc(r.member_id)}">
          <div class="lb-rank" data-testid="cat-lb-rank">${rankLabel(i)}</div>
          <span class="member-avatar" style="background:${color}">${member ? esc(initial(member.name)) : "?"}</span>
          <div style="flex:1; min-width:0;">
            <div class="lb-name" data-testid="cat-lb-name">${member ? esc(member.name) : "Unknown"}</div>
            <div class="lb-record" data-testid="cat-lb-record">W${r.wins} L${r.losses}</div>
          </div>
          <div class="lb-rating" data-testid="cat-lb-rating">${formatRating(r.rating)}</div>
        </div>
      `;
    }).join("");
  }

  // Recent matches
  const matchesEl = document.getElementById("cat-detail-matches");
  if (!matches.length) {
    matchesEl.innerHTML = `<p style="font-size:.9rem; color:var(--hub-text-muted,#6b7280); padding:12px 0;">No matches yet</p>`;
  } else {
    matchesEl.innerHTML = matches.map(match => {
      const ps = participants.filter(p => p.match_id === match.id);
      const teamA = ps.filter(p => p.team === 0);
      const teamB = ps.filter(p => p.team === 1);
      const date = new Date(match.played_at).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      const winner = ps.find(p => p.result === "win")?.team;

      const renderTeam = (team, side) => {
        if (!team.length) return "";
        const isWinner = team[0].result === "win" || team[0].result === "draw";
        return `<span class="match-team${isWinner ? " winner" : ""}">
          ${team.map(p => {
            const m = members.find(mm => mm.id === p.member_id);
            const color = m ? memberColor(p.member_id, members) : "#9ca3af";
            const delta = p.rating_after - p.rating_before;
            const sign = delta >= 0 ? "+" : "";
            return `<span class="member-avatar sm" style="background:${color}" title="${m ? esc(m.name) : "?"}">${m ? esc(initial(m.name)) : "?"}</span>
                    <span>${m ? esc(m.name) : "?"}</span>
                    <span class="match-delta ${delta >= 0 ? "pos" : "neg"}" data-testid="match-delta">${sign}${delta}</span>`;
          }).join(", ")}
        </span>`;
      };

      return `
        <div class="match-row" data-testid="match-row" data-match-id="${esc(match.id)}">
          <div class="match-teams">
            ${renderTeam(teamA, 0)}
            ${teamB.length ? `<span class="match-vs">vs</span>${renderTeam(teamB, 1)}` : ""}
          </div>
          <div class="match-result" data-testid="match-result">
            <span>${date}</span>
            ${match.notes ? `<span>· ${esc(match.notes)}</span>` : ""}
            ${loggedByLabel(match)}
          </div>
        </div>
      `;
    }).join("");
  }
};

window.toggleMemberTeam = function(memberId) {
  const { gameType, teamA, teamB } = recordState;
  const isCooperative = gameType === "cooperative";

  // A match is written as one match row plus two statements per player and must
  // land in a single transaction, so its roster is bounded — see
  // MAX_MATCH_PARTICIPANTS. 1v1 is capped at two by the branches below, but
  // cooperative and team games take everyone offered, and a household or a
  // shared space can hold more members than one batch. Refusing the pick here
  // says so while the user is still choosing, rather than at save time.
  const selected = new Set([...teamA, ...teamB]);
  if (!selected.has(memberId) && selected.size >= MAX_MATCH_PARTICIPANTS) {
    showToast(`Up to ${MAX_MATCH_PARTICIPANTS} players in one match.`);
    return;
  }

  if (isCooperative) {
    const idx = teamA.indexOf(memberId);
    if (idx >= 0) teamA.splice(idx, 1);
    else teamA.push(memberId);
  } else if (gameType === "1v1") {
    const inA = teamA.indexOf(memberId);
    const inB = teamB.indexOf(memberId);
    if (inA >= 0) {
      teamA.splice(inA, 1);
    } else if (inB >= 0) {
      teamB.splice(inB, 1);
    } else if (teamA.length < 1) {
      teamA.push(memberId);
    } else if (teamB.length < 1) {
      teamB.push(memberId);
    }
    // both teams full — do nothing
  } else {
    const inA = teamA.indexOf(memberId);
    const inB = teamB.indexOf(memberId);
    if (inA >= 0) {
      // A → B
      teamA.splice(inA, 1);
      teamB.push(memberId);
    } else if (inB >= 0) {
      // B → unselected
      teamB.splice(inB, 1);
    } else {
      // unselected → A
      teamA.push(memberId);
    }
  }

  renderTeamSlots();
  updateStep2Next();
};

function renderTeamSlots() {
  const { teamA, teamB, gameType } = recordState;
  const isCooperative = gameType === "cooperative";

  // Update chips
  members.forEach(m => {
    const chip = document.getElementById(`chip-${m.id}`);
    const label = document.getElementById(`chip-label-${m.id}`);
    if (!chip) return;
    const inA = teamA.includes(m.id);
    const inB = teamB.includes(m.id);
    chip.classList.toggle("team-a", inA);
    chip.classList.toggle("team-b", inB);
    label.textContent = inA ? (isCooperative ? "✓" : "A") : inB ? "B" : "";
  });

  // Update slot displays
  const slotA = document.getElementById("team-a-slots");
  slotA.innerHTML = teamA.length
    ? teamA.map(id => { const m = members.find(mm => mm.id === id); return m ? `<span style="font-size:.85rem; font-weight:600;">${esc(m.name)}</span>` : ""; }).join(" ")
    : `<span style="font-size:.8rem; color:#9ca3af; align-self:center;">No players selected</span>`;

  if (!isCooperative) {
    const slotB = document.getElementById("team-b-slots");
    slotB.innerHTML = teamB.length
      ? teamB.map(id => { const m = members.find(mm => mm.id === id); return m ? `<span style="font-size:.85rem; font-weight:600;">${esc(m.name)}</span>` : ""; }).join(" ")
      : `<span style="font-size:.8rem; color:#9ca3af; align-self:center;">No players selected</span>`;
  }
}

function updateStep2Next() {
  const { teamA, teamB, gameType } = recordState;

// ── Submit match ───────────────────────────────────────────────────────────────
window.submitMatch = async function() {
  const btn = document.getElementById("record-submit");
  btn.disabled = true;
  btn.textContent = "Saving…";

  try {
    const { categoryId, gameType, teamA, teamB, winningSide } = recordState;
    const isCooperative = gameType === "cooperative";
    const notes = document.getElementById("record-notes").value.trim();

    // The batch invariant, asserted where the batch is actually built rather
    // than only where the roster is picked: 1 + 2N statements have to fit in
    // one transaction. The imported path enforces the same ceiling in
    // isScorableGame(). Past it dbBatchAll splits, and a failure in the second
    // half leaves a match row with some of its players and some of their
    // ratings committed — a state the UI has no way to repair.
    const allIds = [...new Set([...teamA, ...teamB])];
    if (allIds.length > MAX_MATCH_PARTICIPANTS) {
      showToast(`A match can hold at most ${MAX_MATCH_PARTICIPANTS} players.`);
      btn.disabled = false;
      btn.textContent = "Save Match";
      return;
    }

    // Load current ratings for all participants
    const placeholders = allIds.map(() => "?").join(",");
    const { rows: existingRatings } = await db(
      `SELECT * FROM app_leaderboard__lb_ratings WHERE category_id = ? AND member_id IN (${placeholders})`,
      [categoryId, ...allIds]
    );
    const ratingMap = new Map(existingRatings.map(r => [r.member_id, r]));

    const getRating = (id) => ratingMap.get(id)?.rating ?? DEFAULT_RATING;

    const teamAData = teamA.map(id => ({ memberId: id, rating: getRating(id) }));
    const teamBData = isCooperative ? [] : teamB.map(id => ({ memberId: id, rating: getRating(id) }));

    const deltas = calcMatchDeltas(teamAData, teamBData, winningSide, isCooperative);

    // Match, participants and ratings in one transactional batch. These were
    // issued as independent requests (and fanned out with Promise.all), so a
    // failure on any one of them left a match whose participant list and
    // ratings disagreed, with no repair path in the UI.
    const matchId = crypto.randomUUID();
    const now = new Date().toISOString();
    const statements = [{
      // Who typed this in. The value below is a placeholder: the row policy
      // makes logged_by mandatory and overwrites it server-side with the
      // caller's id, so a fabricated match carries the fabricator's name whether
      // they like it or not. See migration 006.
      sql: `INSERT INTO app_leaderboard__lb_matches (id, category_id, played_at, notes, logged_by, visibility) VALUES (?, ?, ?, ?, ?, 'everyone')`,
      params: [matchId, categoryId, now, notes || null, ME?.id ?? ""],
    }];
    for (const d of deltas) {
      const isA = teamA.includes(d.memberId);
      const team = isA ? 0 : 1;

      let result;
      if (isCooperative) result = winningSide === "A" ? "win" : "loss";
      else result = winningSide === "draw" ? "draw" : (isA === (winningSide === "A")) ? "win" : "loss";

      const newRating = Math.max(100, d.ratingBefore + d.delta);
      const isWin = result === "win" ? 1 : 0;
      const isLoss = result === "loss" ? 1 : 0;

      statements.push({
        sql: `INSERT INTO app_leaderboard__lb_participants (id, match_id, member_id, team, result, rating_before, rating_after)
              VALUES (?, ?, ?, ?, ?, ?, ?)`,
        params: [crypto.randomUUID(), matchId, d.memberId, team, result, d.ratingBefore, newRating],
      });
      statements.push({
        sql: RATING_UPSERT,
        // See writeMatch: trailing param is the delta for the conflict arm.
        params: [crypto.randomUUID(), d.memberId, categoryId, newRating, isWin, isLoss, d.delta],
      });
    }
    await dbBatchAll(statements);

    // winner_member_id is set only when the win belongs to exactly one person.
    // A team result has several winners and the payload has no way to say so,
    // and a rule like "award points to the winner" must not silently pick one
    // of them; downstream rules should skip the event when this is null.
    const winners = deltas.filter(d => (
      isCooperative ? winningSide === "A" : teamA.includes(d.memberId) === (winningSide === "A")
    ));
    await publishEvent("leaderboard.match_recorded", matchId, {
      category_id: categoryId,
      winning_side: winningSide,
      player_count: deltas.length,
      winner_member_id: winners.length === 1 && winningSide !== "draw" ? winners[0].memberId : null,
    });

    // Refresh data and go to rankings
    await loadData();
    renderRankings();
    showToast("Match recorded! 🏆");
    switchTab("rankings");
  } catch (e) {
    console.error(e);
    btn.disabled = false;
    btn.textContent = "Save Match";
  }
};

// ── New category modal ─────────────────────────────────────────────────────────
const ICONS = ["🏆","⚽","🏀","🎮","🎯","♟️","🎾","🏓","🎲","🃏","🤺","🏋️","🎸","🎵","🧩","🍕","🍳","🎨","🔢","🚀","🌟","🦁","🐉","🎭","🏊","🤸","⛷️","🏄","🏇","🎳","🎻","📸"];
const selectedIcon = { value: ICONS[0] };

window.openNewCategory = function() {
  if (!canManageCategories()) { showToast("Only adults can create categories."); return; }
  document.getElementById("new-cat-name").value = "";
  selectedIcon.value = ICONS[0];
  document.getElementById("create-cat-btn").disabled = true;
  document.getElementById("emoji-grid").innerHTML = ICONS.map(e => `
    <button class="emoji-btn${e === selectedIcon.value ? " selected" : ""}" onclick="selectIcon('${e}')">${e}</button>
  `).join("");
  document.getElementById("modal-new-category").classList.add("open");
  setTimeout(() => document.getElementById("new-cat-name").focus(), 50);
};

window.closeNewCategory = function() {
  document.getElementById("modal-new-category").classList.remove("open");
};

window.selectIcon = function(emoji) {
  selectedIcon.value = emoji;
  document.querySelectorAll(".emoji-btn").forEach(btn => {
    btn.classList.toggle("selected", btn.textContent === emoji);
  });
};

window.onNewCatInput = function() {
  document.getElementById("create-cat-btn").disabled = !document.getElementById("new-cat-name").value.trim();
};

window.createCategory = async function() {
  if (!canManageCategories()) { showToast("Only adults can create categories."); return; }
  const name = document.getElementById("new-cat-name").value.trim();
  const icon = selectedIcon.value;
  const gameType = document.getElementById("new-cat-type").value;
  if (!name) return;

  // (name, game_type) is UNIQUE as of migration 007, so this INSERT is now
  // REFUSED rather than making a second "Ping Pong" — and the catch below would
  // just re-enable the button and say nothing. The same name under a different
  // game type is a different category and stays allowed; the comparison is
  // case-sensitive to match the index's collation, so what the UI accepts here
  // and what the database accepts do not disagree.
  if (categories.some(c => c.name === name && c.game_type === gameType)) {
    showToast(`"${name}" already exists for that game type.`);
    return;
  }

  const btn = document.getElementById("create-cat-btn");
  btn.disabled = true;
  btn.textContent = "Creating…";

  try {
    const id = crypto.randomUUID();
    const now = new Date().toISOString();
    await db(
      `INSERT INTO app_leaderboard__lb_categories (id, name, icon, game_type, created_at, created_by)
       VALUES (?, ?, ?, ?, ?, ?)`,
      [id, name, icon, gameType, now, ME?.id ?? ""]
    );
    categories.push({ id, name, icon, game_type: gameType, match_count: 0, last_played: null, created_at: now });
    closeNewCategory();
    renderCategories();
    showToast(`"${name}" created!`);
  } catch (e) {
    // Reachable when another client created the same category between the check
    // above and this insert — the UNIQUE index is what settles that race, and
    // the loser needs to be told rather than left looking at a reset button.
    console.error(e);
    showToast(`Could not create "${name}".`);
    btn.disabled = false;
    btn.textContent = "Create";
  }
};

// ── Toast ──────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("visible");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("visible"), 2500);
}

// ── Expose switchTab for inline onclick on modal close ────────────────────────
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeNewCategory();
});
document.getElementById("modal-new-category").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeNewCategory();
});

// ── Delegated listeners (avoid interpolating DB-controlled ids into inline
//    onclick handlers — attribute entity-decoding defeats HTML escaping there) ──
document.getElementById("champions-grid").addEventListener("click", e => {
  const el = e.target.closest("[data-cat-id]");
  if (el) openCategoryDetail(el.dataset.catId);
});
document.getElementById("categories-grid").addEventListener("click", e => {
  const el = e.target.closest("[data-cat-id]");
  if (el) openCategoryDetail(el.dataset.catId);
});
document.getElementById("record-member-chips").addEventListener("click", e => {
  const el = e.target.closest("[data-member-id]");
  if (el) toggleMemberTeam(el.dataset.memberId);
});

function handleDeepLink() {
  const categoryId = new URLSearchParams(window.location.search).get("categoryId");
  if (!categoryId) return;
  openCategoryDetail(categoryId);
}

init().then(handleDeepLink);
</script>
</body>
</html>
